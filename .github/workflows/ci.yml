name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: Tests and golden traces (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p actgram-examples --no-default-features

  checks:
    name: Format, lint, docs and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo install cargo-deny --version 0.21.0 --locked
      - run: cargo deny check

  msrv:
    name: Minimum supported Rust (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked --workspace --all-features

  miri:
    name: Executor under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install nightly-2026-11-18 --profile minimal --component miri --component rust-src
      - run: cargo +nightly-2026-11-18 miri test --locked -p actgram-exec

  evidence:
    name: Reduced evidence experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo xtask evidence --seeds 32 --out-dir target/evidence-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reduced-evidence
          path: target/evidence-ci
          if-no-files-found: error

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --locked --workspace --all-features --fail-under-lines 80

  fuzz:
    name: Grammar builder fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: rustup toolchain install nightly-2026-11-18 --profile minimal --component rust-src
      - run: cargo +nightly-2026-11-18 fuzz run builder -- -seed=17 -runs=10000 -max_len=320 -timeout=5
